<!doctype html>

<title>World view harness</title>
<style>
  body { margin: 0; background: #0b0d16; color: #ddd; font: 13px ui-monospace, monospace; }
  #hud { position: fixed; left: 8px; top: 8px; z-index: 20; background: rgba(0, 0, 0, 0.6); padding: 6px 8px; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<!-- Replays a recorded (or synthetic) dataset through the real scene.js + worldmode.js, without a robot or headset.
     python3 -m http.server 8080 -d xr-client/pages, then
     http://localhost:8080/dev/worldview.html?data=data/rec1&view=world   (view=simon: the room-scan panorama)
     Params: speed (replay speed), extra (s of delay added to the frames, like the headset's network), lag (fixed lag
     in s instead of the measured one), until (s: stop the replay there), pano (1024/2048/4096). -->
<div id="hud">loading…</div>
<video id="video" muted playsinline hidden></video>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module" src="harness.js"></script>
</body>
</html>
