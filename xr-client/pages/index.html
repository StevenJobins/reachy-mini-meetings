<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reachy Meetings XR</title>
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0b0d12; --panel: rgba(255,255,255,0.045); --line: rgba(255,255,255,0.09);
    --fg: #eef0f4; --muted: #9aa1ad; --accent: #ff9500; --ok: #4ade80; --wait: #fbbf24; --off: #5b616e;
    --radius: 20px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg);
    background-image:
      radial-gradient(900px 500px at 10% -10%, rgba(255,149,0,0.16), transparent 60%),
      radial-gradient(800px 600px at 110% 10%, rgba(99,102,241,0.14), transparent 60%);
    background-attachment: fixed;
  }
  button, select, input { font: inherit; color: inherit; }

  /* header */
  header { display: flex; align-items: center; gap: 14px; padding: 16px 24px; flex-wrap: wrap; }
  header img { width: 40px; height: 40px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: 0.2px; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .chips { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  .chip[data-state="ok"] { color: var(--fg); }
  .chip[data-state="ok"]::before { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .chip[data-state="wait"]::before { background: var(--wait); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  /* layout */
  main { display: grid; gap: 20px; padding: 0 24px 24px; max-width: 1400px; margin: 0 auto; }
  @media (min-width: 1000px) { main { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; } }
  @media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

  /* stage: video + controls */
  .stage { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .screen { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #05060a; }
  .screen video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .screen .idle { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; color: var(--muted); text-align: center; padding: 20px; }
  .screen .idle img { width: 84px; height: 84px; opacity: 0.85; }
  .screen:has(video[hidden]) .idle { display: flex; }
  #live-caption { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: 86%;
    padding: 10px 18px; border-radius: 14px; background: rgba(10,12,18,0.72); backdrop-filter: blur(8px);
    font-size: clamp(15px, 2vw, 22px); text-align: center; border: 1px solid var(--line); }
  #live-caption[hidden] { display: none; }
  #message { color: var(--muted); min-height: 1.5em; margin: 0 4px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .actions button { border: 1px solid var(--line); border-radius: 999px; cursor: pointer; padding: 11px 20px;
    background: rgba(255,255,255,0.06); transition: transform .08s, background .15s; }
  .actions button:hover { background: rgba(255,255,255,0.12); }
  .actions button:active { transform: scale(0.97); }
  .actions button.primary { background: var(--accent); color: #111; border-color: transparent; font-weight: 650;
    padding: 13px 34px; font-size: 18px; box-shadow: 0 8px 28px rgba(255,149,0,0.28); }
  .actions button.primary:hover { background: #ffa92e; }
  [hidden] { display: none !important; }
  /* mic: big round call-style button, red when muted */
  .actions button#mic { display: inline-flex; align-items: center; gap: 10px; padding: 8px 20px 8px 8px; font-weight: 650;
    background: rgba(255,255,255,0.1); }
  #mic .mic-icon { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.14); }
  #mic .mic-icon svg { width: 28px; height: 28px; }
  #mic .slash { display: none; }
  #mic.muted { background: rgba(229,72,77,0.18); border-color: rgba(229,72,77,0.6); color: #ffb4b6; }
  #mic.muted .mic-icon { background: #e5484d; color: #fff; box-shadow: 0 6px 22px rgba(229,72,77,0.45); }
  #mic.muted .slash { display: inline; }
  #toast { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px;
    background: rgba(10,12,18,0.8); border: 1px solid var(--line); font-weight: 650; backdrop-filter: blur(8px); }

  /* side column */
  aside { display: flex; flex-direction: column; gap: 20px; }
  aside .card { padding: 16px 18px; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .card-head h2 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  select, input { background: rgba(0,0,0,0.3); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  #captions { max-height: 340px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  #captions:empty::before { content: "Captions appear here when someone speaks."; color: var(--muted); font-size: 14px; }
  .line { display: grid; gap: 2px; }
  .line .who { font-size: 12px; font-weight: 650; color: var(--c); }
  .line .who::before { content: "● "; }
  .line.partial .text { color: var(--muted); font-style: italic; }
  .line .sub { font-size: 13px; color: var(--muted); }
  #notes h3 { font-size: 14px; margin: 6px 0; color: var(--accent); }
  #notes ul { margin: 0 0 8px; padding-left: 18px; }
  #notes li { margin: 3px 0; }
  .muted { color: var(--muted); font-size: 13px; margin: 0; }

  /* settings */
  details.card > summary { cursor: pointer; color: var(--muted); list-style: none; }
  details.card > summary::before { content: "⚙  "; }
  .settings-body { display: grid; gap: 12px; margin-top: 12px; font-size: 14px; }
  .settings-body label { display: grid; gap: 4px; color: var(--muted); }
  .settings-body label.check { display: flex; align-items: center; gap: 8px; }
  .settings-body .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .settings-body button { border: 1px solid var(--line); background: rgba(255,255,255,0.06); border-radius: 10px; padding: 6px 12px; cursor: pointer; }
  #debug-text, #log, #prev-log { font: 12px ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  #debug-text { color: #86efac; }
  #log, #prev-log { max-height: 200px; overflow: auto; color: var(--muted); }
</style>
</head>
<body>
<header>
  <img src="icon.svg" alt="">
  <h1>Reachy Meetings <span>XR</span></h1>
  <span id="version" class="muted"></span>
  <div class="chips">
    <span class="chip" id="chip-robot"><span>Robot</span></span>
    <span class="chip" id="chip-camera"><span>Camera</span></span>
    <span class="chip" id="chip-captions"><span>Captions</span></span>
    <span class="chip" id="chip-xr"><span>VR</span></span>
  </div>
</header>

<main>
  <section class="card stage">
    <div class="screen">
      <video id="video" autoplay playsinline muted></video>
      <div class="idle"><img src="icon.svg" alt=""><div>Camera is off while Reachy sleeps</div></div>
      <div id="live-caption" hidden></div>
      <div id="toast" hidden></div>
    </div>
    <div id="message">Loading…</div>
    <div class="actions">
      <button id="wake" class="primary" hidden>Wake up</button>
      <button id="start" class="primary" hidden>Start</button>
      <button id="mic" hidden title="Mute (M)">
        <span class="mic-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/>
          <path class="slash" d="M3 3l18 18" stroke-width="2.5"/></svg></span>
        <span class="mic-label">Mute</span>
      </button>
      <button id="talk" hidden>🙋 I want to talk</button>
      <button id="follow" hidden>🎯 Following speaker: tap to stop</button>
      <button id="mute" hidden>🔇 Robot muted: tap to unmute</button>
      <button id="sleep" hidden>Sleep</button>
      <button id="signin" class="primary" hidden>Sign in with Hugging Face</button>
      <button id="retry" class="primary" hidden>Try again</button>
    </div>
  </section>

  <aside>
    <section class="card">
      <div class="card-head">
        <h2>Live transcript</h2>
        <select id="caption-mode" title="What the speech bubbles show">
          <option value="both">Translation + original</option>
          <option value="translation">Translation only</option>
          <option value="original">Original only</option>
        </select>
      </div>
      <div id="captions"></div>
    </section>

    <section class="card">
      <div class="card-head"><h2>Meeting notes</h2></div>
      <div id="notes"><p class="muted">The summary and action items appear after the first minute of talking.</p></div>
    </section>

    <details class="card">
      <summary>Settings &amp; debug</summary>
      <div class="settings-body">
        <label>Caption server <input id="captions-url" placeholder="ws://localhost:8766"></label>
        <label class="check"><input type="checkbox" id="show-faces"> Show detected faces (frame in the video)</label>
        <div class="row">
          <button id="recenter">Recenter</button>
          <button id="signout">Sign out</button>
        </div>
        <div id="debug-text"></div>
        <div id="log"></div>
        <details><summary>Previous session log (survives a crash)</summary><div id="prev-log"></div></details>
      </div>
    </details>
  </aside>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "reachy": "https://cdn.jsdelivr.net/npm/@pollen-robotics/reachy-mini-sdk@1.11.0/+esm"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
