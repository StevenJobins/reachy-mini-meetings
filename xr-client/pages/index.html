<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reachy Meetings XR</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg: #111; --fg: #eee; --muted: #999; --accent: #ff9500; }
  body { margin: 0; font: 18px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); padding: 16px; }
  main { max-width: 720px; margin: 0 auto; text-align: center; }
  img.logo { width: 96px; height: 96px; margin-top: 24px; }
  h1 { font-size: 28px; margin: 8px 0; }
  #message { color: var(--muted); min-height: 3em; margin: 8px 0 24px; }
  button { font-size: 20px; padding: 14px 28px; border: 0; border-radius: 12px; cursor: pointer; margin: 4px; }
  button.primary { background: var(--accent); color: #000; font-size: 28px; padding: 20px 64px; }
  button.secondary { background: #2a2a2a; color: var(--fg); font-size: 16px; padding: 10px 18px; }
  video { width: 100%; background: #000; border-radius: 12px; margin: 24px 0 8px; }
  details { text-align: left; color: var(--muted); font-size: 14px; }
  #debug-text, #log { font: 12px ui-monospace, monospace; white-space: pre-wrap; }
  #debug-text { color: #7f7; }
  #log { max-height: 180px; overflow: auto; }
  #captions { text-align: left; margin: 0 0 16px; }
  #captions .partial { color: var(--muted); font-style: italic; }
  #captions-url { width: 22em; font: 14px ui-monospace, monospace; background: #222; color: var(--fg); border: 1px solid #444; border-radius: 6px; padding: 6px; }
</style>
</head>
<body>
<main>
  <img class="logo" src="icon.svg" alt="">
  <h1>Reachy Meetings XR</h1>
  <div id="message">Loading…</div>
  <button id="wake" class="primary" hidden>Wake up</button>
  <button id="start" class="primary" hidden>Start</button>
  <button id="talk" class="secondary" hidden>🙋 I want to talk</button>
  <button id="sleep" class="secondary" hidden>Sleep</button>
  <button id="signin" class="primary" hidden>Sign in with Hugging Face</button>
  <button id="retry" class="primary" hidden>Try again</button>
  <video id="video" autoplay playsinline muted></video>
  <div id="captions"></div>
  <details>
    <summary>Debug</summary>
    <button id="recenter" class="secondary">Recenter</button>
    <button id="signout" class="secondary">Sign out</button>
    <label>Captions <input id="captions-url" placeholder="ws://localhost:8766"></label>
    <div id="debug-text"></div>
    <div id="log"></div>
  </details>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "reachy": "https://cdn.jsdelivr.net/npm/@pollen-robotics/reachy-mini-sdk@1.11.0/+esm"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
